name: tests

# Converted to manual workflow_dispatch as local VPS testing gate replaces GitHub Actions CI
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Application
        run: |
          mkdir -p database
          touch database/database.sqlite
          composer setup
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run security regression suite
        run: php artisan test tests/Feature/Security

      - name: Run CI Checks
        run: composer ci:check
