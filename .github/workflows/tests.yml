name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        # composer setup runs `php artisan migrate --force` against the
        # app's real .env, which defaults to Postgres — not available on
        # this runner. The actual test suite (composer ci:check) never
        # touches this migration: phpunit.xml already overrides
        # DB_CONNECTION to an isolated sqlite :memory: database for every
        # test run. Point the setup step's migration at a throwaway sqlite
        # file instead of standing up a Postgres service just to satisfy a
        # migration whose result nothing downstream depends on.
        run: |
          mkdir -p database
          touch database/database.sqlite
          composer setup
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run CI Checks
        run: composer ci:check
