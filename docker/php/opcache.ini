opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=10000
; Images are immutable per deploy (a new container always means a new image),
; so code never changes underneath a running container -- safe to skip the
; per-request mtime check.
opcache.validate_timestamps=0
opcache.save_comments=1
